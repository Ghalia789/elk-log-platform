input {
	file {
		path => ["/usr/share/logstash/uploads/*.json", "/usr/share/logstash/uploads/*.ndjson"]
		exclude => ["*.part"]
		mode => "read"
		start_position => "beginning"
		file_completed_action => "log"
		file_completed_log_path => "/usr/share/logstash/data/completed_json.log"
		sincedb_path => "/usr/share/logstash/data/sincedb_json"
	}
}

filter {
	json {
		source => "message"
		tag_on_failure => ["_jsonparsefailure"]
	}

	date {
		match => ["timestamp", "ISO8601"]
		target => "@timestamp"
		tag_on_failure => ["_dateparsefailure"]
	}

	mutate {
		convert => {
			"status_code" => "integer"
			"response_time_ms" => "float"
		}
		tag_on_failure => ["_mutatefailure"]
	}

	dissect {
		mapping => {
			"[log][file][path]" => "/usr/share/logstash/uploads/%{upload_id}__%{?original_name}"
		}
		tag_on_failure => ["_upload_id_parse_failure"]
	}
}

output {
	if "_jsonparsefailure" in [tags] or "_dateparsefailure" in [tags] or "_mutatefailure" in [tags] or "_upload_id_parse_failure" in [tags] {
		elasticsearch {
			hosts => ["http://elasticsearch:9200"]
			action => "create"
			index => "logs-failed-%{+YYYY.MM.dd}"
		}
	} else {
		elasticsearch {
			hosts => ["http://elasticsearch:9200"]
			action => "create"
			index => "logs-saas-%{+YYYY.MM.dd}"
		}
	}
}
