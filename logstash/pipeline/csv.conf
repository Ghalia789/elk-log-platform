input {
	file {
		path => "/usr/share/logstash/uploads/*.csv"
		exclude => "*.part"
		mode => "read"
		start_position => "beginning"
		file_completed_action => "log"
		file_completed_log_path => "/usr/share/logstash/data/completed_csv.log"
		sincedb_path => "/usr/share/logstash/data/sincedb_csv"
	}
}

filter {
	if [message] == "timestamp,level,service,endpoint,http_method,status_code,response_time_ms,client_ip,user_id,trace_id,message" {
		drop {}
	}

	csv {
		source => "message"
		separator => ","
		skip_header => true
		columns => [
			"timestamp",
			"level",
			"service",
			"endpoint",
			"http_method",
			"status_code",
			"response_time_ms",
			"client_ip",
			"user_id",
			"trace_id",
			"message"
		]
	}

	date {
		match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
		target => "@timestamp"
		tag_on_failure => ["_dateparsefailure"]
	}

	mutate {
		convert => {
			"status_code" => "integer"
			"response_time_ms" => "float"
		}
		tag_on_failure => ["_mutatefailure"]
	}

	dissect {
		mapping => {
			"[log][file][path]" => "/usr/share/logstash/uploads/%{upload_id}__%{source_file}"
		}
		tag_on_failure => ["_upload_id_parse_failure"]
	}

	if [client_ip] and [client_ip] !~ /^(10\.|127\.|169\.254\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|::1$|fc[0-9a-fA-F]{2}:|fd[0-9a-fA-F]{2}:|fe80:)/ {
		geoip {
			source => "client_ip"
			target => "geoip"
			tag_on_failure => []
		}
	}
}

output {
	if [tags] =~ /^_/ {
		elasticsearch {
			hosts => ["${ES_HOST:http://elasticsearch:9200}"]
			action => "create"
			index => "logs-failed-%{+YYYY.MM.dd}"
		}
	} else {
		elasticsearch {
			hosts => ["${ES_HOST:http://elasticsearch:9200}"]
			action => "create"
			index => "logs-saas-%{+YYYY.MM.dd}"
		}
	}
}
