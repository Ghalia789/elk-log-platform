input {
	file {
		path => "/usr/share/logstash/uploads/*.csv"
		mode => "read"
		start_position => "beginning"
		file_completed_action => "log"
		file_completed_log_path => "/usr/share/logstash/data/completed_csv.log"
		sincedb_path => "/usr/share/logstash/data/sincedb_csv"
	}
}

filter {
	csv {
		source => "message"
		separator => ","
		skip_header => true
		columns => [
			"timestamp",
			"level",
			"service",
			"endpoint",
			"http_method",
			"status_code",
			"response_time_ms",
			"client_ip",
			"user_id",
			"trace_id",
			"message"
		]
		tag_on_failure => ["_csvparsefailure"]
	}

	date {
		match => ["timestamp", "ISO8601"]
		target => "@timestamp"
		tag_on_failure => ["_dateparsefailure"]
	}

	mutate {
		convert => {
			"status_code" => "integer"
			"response_time_ms" => "integer"
		}
		tag_on_failure => ["_mutatefailure"]
	}

	dissect {
		mapping => {
			"[log][file][path]" => "/usr/share/logstash/uploads/%{upload_id}__%{?original_name}"
		}
		tag_on_failure => ["_upload_id_parse_failure"]
	}
}

output {
	elasticsearch {
		hosts => ["http://elasticsearch:9200"]
		index => "logs-saas-%{+YYYY.MM.dd}"
	}
}
